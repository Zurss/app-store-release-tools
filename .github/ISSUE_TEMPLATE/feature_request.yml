name: Feature request
description: Suggest a focused improvement. English and Russian are welcome.
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, configuration files, private app data, or raw logs."
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
